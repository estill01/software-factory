name: Software Factory v2 normalize integrated source

on:
  push:
    branches:
      - agent/software-factory-v2-native-refactor
    paths:
      - .v2-normalize-pending
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: software-factory-v2-normalize
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/software-factory-v2-native-refactor
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: runtime/pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e 'runtime[dev]'

      - name: Normalize and mechanically validate native source
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix runtime/src runtime/tests
          python -m ruff format runtime/src runtime/tests
          python -m ruff check runtime/src runtime/tests
          python -m ruff format --check runtime/src runtime/tests
          python -m compileall -q runtime/src runtime/tests

      - name: Commit normal reviewable source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .v2-normalize-pending
          git config user.name "software-factory-v2-bot"
          git config user.email "software-factory-v2-bot@users.noreply.github.com"
          git add -- runtime/src runtime/tests .v2-normalize-pending
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No normalization changes"
            exit 0
          fi
          git commit -m "style(v2): normalize integrated runtime source"
          git push origin HEAD:agent/software-factory-v2-native-refactor
