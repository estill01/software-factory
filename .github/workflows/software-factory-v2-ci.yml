name: Software Factory v2 supervision landing

on:
  push:
    branches:
      - agent/software-factory-v2-native-refactor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: software-factory-v2-supervision-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/software-factory-v2-native-refactor
          fetch-depth: 0

      - name: Apply immutable supervision slice
        id: staged_slice
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.sf-upload/supervision-v2/part-*)
          if (( ${#parts[@]} == 0 )); then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test ${#parts[@]} -eq 4
          git config user.name "software-factory-v2-bot"
          git config user.email "software-factory-v2-bot@users.noreply.github.com"
          cat "${parts[@]}" > "$RUNNER_TEMP/supervision.patch.gz.b64"
          test "$(sha256sum "$RUNNER_TEMP/supervision.patch.gz.b64" | awk '{print $1}')" = "908b1d944a62945bba1448cf6ec9bc757ff150a502109bc4548a43d9bab31cea"
          base64 --decode "$RUNNER_TEMP/supervision.patch.gz.b64" > "$RUNNER_TEMP/supervision.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/supervision.patch.gz" | awk '{print $1}')" = "b2c62bacabe78fc0a801662f5f5aed7e132ceee07b17db48ad97628c6334f686"
          gzip -dc "$RUNNER_TEMP/supervision.patch.gz" > "$RUNNER_TEMP/supervision.patch"
          test "$(sha256sum "$RUNNER_TEMP/supervision.patch" | awk '{print $1}')" = "b2813473b8311a51e742b885b5d6e6a7491612b21933b1992168fd72a5e12bb6"
          git am "$RUNNER_TEMP/supervision.patch"
          git mv .sf-upload/supervision-v2/test_reflection.py runtime/tests/test_reflection.py
          git rm -r .sf-upload/supervision-v2
          git commit --amend --no-edit
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: runtime/pyproject.toml

      - name: Install runtime development dependencies
        run: python -m pip install -e 'runtime[dev]'

      - name: Normalize newly applied source
        if: steps.staged_slice.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/src/software_factory/reflection.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              ("from typing import Any\n", "from typing import Any, cast\n"),
              ("        recurring = {}\n", "        recurring: dict[str, int] = {}\n"),
              ('                hypothesis_type=item["type"],\n', '                hypothesis_type=cast(str, item["type"]),\n'),
              ('                statement=item["statement"],\n', '                statement=cast(str, item["statement"]),\n'),
              ('                expected_evidence=item["expected"],\n', '                expected_evidence=cast(Mapping[str, Any], item["expected"]),\n'),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"reflection type boundary changed: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff check --fix --unsafe-fixes runtime/src/software_factory/reflection.py
          python -m ruff check --fix runtime/src runtime/tests
          python -m ruff format runtime/src runtime/tests
          git add -- runtime/README.md runtime/pyproject.toml runtime/src runtime/tests
          git commit --amend --no-edit

      - name: Lint
        run: python -m ruff check runtime/src runtime/tests

      - name: Format check
        run: python -m ruff format --check runtime/src runtime/tests

      - name: Type check
        run: python -m mypy runtime/src/software_factory

      - name: Compile
        run: python -m compileall -q runtime/src runtime/tests

      - name: Runtime tests with branch coverage
        run: >-
          python -m pytest runtime/tests -q
          --cov=software_factory --cov-branch
          --cov-report=term-missing
          --cov-fail-under=72

      - name: Build wheel
        run: python -m build --wheel runtime

      - name: Smoke-test installed entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/install-smoke"
          "$RUNNER_TEMP/install-smoke/bin/python" -m pip install runtime/dist/*.whl
          HOME_DIR="$RUNNER_TEMP/factory-home"
          "$RUNNER_TEMP/install-smoke/bin/software-factory" --home "$HOME_DIR" init
          "$RUNNER_TEMP/install-smoke/bin/software-factory" --home "$HOME_DIR" health
          "$RUNNER_TEMP/install-smoke/bin/software-factoryd" --home "$HOME_DIR" --once

      - name: Push validated ordinary source
        if: steps.staged_slice.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/software-factory-v2-native-refactor
