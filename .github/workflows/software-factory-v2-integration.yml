name: Software Factory v2 integration landing

on:
  push:
    branches:
      - agent/software-factory-v2-native-refactor
    paths:
      - .v2-integration-pending
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: software-factory-v2-integration-landing
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/software-factory-v2-native-refactor
          fetch-depth: 0

      - name: Detect integration request
        id: request
        shell: bash
        run: |
          if [[ -f .v2-integration-pending ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.request.outputs.pending == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            rsi-core/pyproject.toml
            runtime/pyproject.toml

      - name: Apply readable integration
        if: steps.request.outputs.pending == 'true'
        run: |
          python scripts/land_v2_runtime_integration.py
          rm .v2-integration-pending

      - name: Install development dependencies
        if: steps.request.outputs.pending == 'true'
        run: python -m pip install -e 'rsi-core[dev]' -e 'runtime[dev]'

      - name: Normalize owned source
        if: steps.request.outputs.pending == 'true'
        run: |
          python -m ruff check --fix runtime/src runtime/tests
          python -m ruff format runtime/src runtime/tests

      - name: Lint
        if: steps.request.outputs.pending == 'true'
        run: python -m ruff check runtime/src runtime/tests

      - name: Format check
        if: steps.request.outputs.pending == 'true'
        run: python -m ruff format --check runtime/src runtime/tests

      - name: Type check
        if: steps.request.outputs.pending == 'true'
        run: python -m mypy runtime/src/software_factory

      - name: Compile
        if: steps.request.outputs.pending == 'true'
        run: python -m compileall -q runtime/src runtime/tests

      - name: Behavioral tests with branch coverage
        if: steps.request.outputs.pending == 'true'
        run: >-
          python -m pytest rsi-core/tests runtime/tests -q
          --cov=rsi_core --cov=software_factory --cov-branch
          --cov-report=term-missing
          --cov-fail-under=72

      - name: Build wheels
        if: steps.request.outputs.pending == 'true'
        run: |
          python -m build --wheel rsi-core
          python -m build --wheel runtime

      - name: Smoke installed entrypoints
        if: steps.request.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/v2-install"
          "$RUNNER_TEMP/v2-install/bin/python" -m pip install rsi-core/dist/*.whl runtime/dist/*.whl
          HOME_DIR="$RUNNER_TEMP/factory-home"
          "$RUNNER_TEMP/v2-install/bin/software-factory" --home "$HOME_DIR" init
          "$RUNNER_TEMP/v2-install/bin/software-factory" --home "$HOME_DIR" health
          "$RUNNER_TEMP/v2-install/bin/software-factory" --home "$HOME_DIR" doctor --root "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/v2-install/bin/software-factoryd" --home "$HOME_DIR" --once
          "$RUNNER_TEMP/v2-install/bin/software-factory-api" --help
          "$RUNNER_TEMP/v2-install/bin/sf-skill" --help

      - name: Commit validated integration
        if: steps.request.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "software-factory-v2-bot"
          git config user.email "software-factory-v2-bot@users.noreply.github.com"
          git add -- runtime scripts/land_v2_runtime_integration.py .v2-integration-pending
          git diff --cached --check
          git commit -m "feat(v2): integrate adaptive runtime capability owners"
          git push origin HEAD:agent/software-factory-v2-native-refactor
