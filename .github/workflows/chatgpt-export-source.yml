name: ChatGPT temporary source export

on:
  push:
    branches:
      - chatgpt-temp-archive-link

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact reviewed baseline
        uses: actions/checkout@v4
        with:
          ref: 60d17b1dfceae232d1e8df62566c6b2ffd9322ba
          fetch-depth: 1
      - name: Build source archive
        run: tar --exclude=.git -czf "$RUNNER_TEMP/software-factory-source.tar.gz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: software-factory-source
          path: ${{ runner.temp }}/software-factory-source.tar.gz
          if-no-files-found: error
          retention-days: 1
