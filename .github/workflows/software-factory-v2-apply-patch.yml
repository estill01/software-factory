name: Apply reviewable Software Factory v2 patch

on:
  push:
    branches:
      - agent/software-factory-v2-native-refactor

permissions:
  contents: write

concurrency:
  group: software-factory-v2-reviewable-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/software-factory-v2-native-refactor
          fetch-depth: 0

      - name: Detect pending patch
        id: pending
        shell: bash
        run: |
          if [[ -f .sf-patches/pending.patch ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.pending.outputs.present == 'true'
        with:
          python-version: '3.11'

      - name: Verify and apply reviewable patch
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .sf-patches/pending.patch
          git apply --index .sf-patches/pending.patch
          git rm .sf-patches/pending.patch .github/workflows/software-factory-v2-apply-patch.yml

      - name: Validate composed runtime
        if: steps.pending.outputs.present == 'true'
        run: |
          python -m pip install -e 'runtime[dev]'
          python -m compileall -q runtime/src runtime/tests
          python -m pytest runtime/tests -q

      - name: Commit validated source
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "software-factory-v2-bot"
          git config user.email "software-factory-v2-bot@users.noreply.github.com"
          git commit -m "refactor: compose runtime services explicitly"
          git push origin HEAD:agent/software-factory-v2-native-refactor
